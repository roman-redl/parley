# parley: LibreChat plus a shared tools container (MCP) for the bots.
# Secrets and paths come only from .env on the VPS (template: .env.example).
name: parley

# Log rotation for every service: without it the json-file logs of Docker grow without limit.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  librechat:
    # Derived image: the LibreChat version is pinned in librechat/Dockerfile (FROM tag), which
    # also patches the PWA theme colour.
    build: ./librechat
    image: parley-librechat:local
    env_file: .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      # Where LibreChat writes generated secrets if they are missing from .env
      # (same as the official compose file).
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
    # The ./data/librechat/* directories are created in advance as this same user
    # (see README); otherwise Docker creates them as root and writes fail.
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      default:
      db:
      # Shared with playwright: LibreChat reaches the browser MCP server as playwright:8931.
      browser:
      caddy:
        aliases: [parley-librechat]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./data/librechat/images:/app/client/public/images
      - ./data/librechat/uploads:/app/uploads
      - ./data/librechat/logs:/app/logs
      - ./data/librechat/data:/app/data
    depends_on:
      mongodb:
        condition: service_started
      tools:
        condition: service_healthy
      playwright:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

  mongodb:
    # Version and command match the official LibreChat v0.8.8 docker-compose.yml.
    image: mongo:8.0.20
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    command: mongod --noauth
    # The database has no authentication, so it sits only on the db network together with
    # librechat: the agents' terminal in the tools container cannot reach it.
    networks:
      - db
    volumes:
      - ./data/mongo:/data/db
    logging: *logging
    restart: unless-stopped

  tools:
    build: ./tools
    image: parley-tools:local
    # No ports are published: the service is reachable only inside the compose network.
    expose:
      - "8000"
    # Lets the container reach the VPS host over ssh as host.docker.internal (README, step 2).
    # This gives the bots a full shell on the host with passwordless sudo, by the owner's choice.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-}
    volumes:
      - ${NOTES_DIR:?set NOTES_DIR in .env}:/data/notes
      - ${HANDOFF_DIR:?set HANDOFF_DIR in .env}:/data/handoff
      # Deploy keys, ssh config and known_hosts are prepared by the admin on the VPS.
      - ${TOOLS_SSH_DIR:?set TOOLS_SSH_DIR in .env}:/root/.ssh:ro
      # DesktopCommander config and logs (~/.claude-server-commander).
      - ./data/tools/desktop-commander:/root/.claude-server-commander
      # Scratch directory for web pages: Playwright writes page snapshots here, the bots search
      # them in the terminal, download PDFs and Jina Reader output here. Same path in the
      # playwright container, so a file path returned by the browser works in the terminal.
      - ./data/web:/data/web
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  playwright:
    # Official image, linux/arm64 included. Version is pinned; upgrades are deliberate (CLAUDE.md).
    image: mcr.microsoft.com/playwright/mcp:v0.0.85
    # The image already runs headless chromium with --no-sandbox. Added flags:
    #   --host/--port           streamable HTTP MCP at http://playwright:8931/mcp;
    #   --allowed-hosts         the server rejects (403) any Host header not listed, and the default
    #                           list is only localhost, so the compose service name is listed;
    #   --isolated              browser profile in memory, nothing persisted between sessions;
    #   --ignore-roots          do not ask the client for workspace roots (LibreChat has none);
    #   --snapshot-mode none    navigate, click, type etc. do not append the page snapshot to their
    #                           result; the bot saves it explicitly with browser_snapshot and a
    #                           filename, then searches the file in the terminal;
    #   --codegen none          results do not repeat the executed Playwright code (fewer tokens);
    #   --output-dir            automatically named files (console logs, screenshots) go here;
    #   --file-paths absolute   tool results print absolute paths that work in the tools container;
    #   --output-max-size       when the files in /data/web exceed 200 MB, the oldest are deleted
    #                           after each tool call (the files of the current call are kept).
    command:
      - --host=0.0.0.0
      - --port=8931
      - --allowed-hosts=playwright:8931
      - --isolated
      - --ignore-roots
      - --snapshot-mode=none
      - --codegen=none
      - --output-dir=/data/web
      - --file-paths=absolute
      - --output-max-size=209715200
    # The working directory is the only place besides --output-dir where the server may write:
    # relative and absolute file names outside these two are refused.
    working_dir: /data/web
    # Same user as the other data-writing containers: the files in ./data/web are readable
    # (and deletable) by the host user, and root in the tools container reads them too.
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    environment:
      # The user from .env has no home directory in the image; chromium needs a writable one.
      HOME: /tmp
    # Chromium needs more shared memory than the Docker default of 64 MB.
    shm_size: 1gb
    mem_limit: 3g
    volumes:
      - ./data/web:/data/web
    # No ports are published. The container sits only on the browser network (shared with
    # librechat), not on default: the browser, which opens arbitrary web pages, cannot reach
    # tools:8000 (the unauthenticated shell MCP server) or mongodb. It can still reach
    # librechat:3080 and the internet (the network is not internal), the host gateway and the
    # cloud metadata service 169.254.169.254.
    networks:
      - browser
    expose:
      - "8931"
    # The browser starts on the first tool call, so the check only waits for the port.
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8931,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    restart: unless-stopped

networks:
  db:
    internal: true
  # Between librechat and playwright only. A regular bridge network (not internal): the browser
  # needs the internet.
  browser:
  # The network where Caddy runs (selfhost-music compose project). Caddy is in a container
  # and cannot reach host ports on 127.0.0.1, so it proxies by name:
  # parley-librechat:3080. The 127.0.0.1 port is for the ssh tunnel.
  caddy:
    external: true
    name: ${CADDY_NETWORK:-selfhost-music_default}
