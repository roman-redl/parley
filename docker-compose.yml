# parley: LibreChat and Open WebUI side by side for comparison, plus a shared tools container.
# Secrets and paths come only from .env on the VPS (template: .env.example).
name: parley

services:
  librechat:
    # Version is pinned. The image is multi-architecture (amd64 + arm64).
    image: registry.librechat.ai/librechat-ai/librechat:v0.8.8
    env_file: .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      # Where LibreChat writes generated secrets if they are missing from .env
      # (same as the official compose file).
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
    # The ./data/librechat/* directories are created in advance as this same user
    # (see README); otherwise Docker creates them as root and writes fail.
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:3080:3080"
    networks:
      default:
      db:
      caddy:
        aliases: [parley-librechat]
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./data/librechat/images:/app/client/public/images
      - ./data/librechat/uploads:/app/uploads
      - ./data/librechat/logs:/app/logs
      - ./data/librechat/data:/app/data
    depends_on:
      mongodb:
        condition: service_started
      tools:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    # Version and command match the official LibreChat v0.8.8 docker-compose.yml.
    image: mongo:8.0.20
    user: "${UID:-1000}:${GID:-1000}"
    command: mongod --noauth
    # The database has no authentication, so it sits only on the db network together with
    # librechat: the agents' terminal in the tools container cannot reach it.
    networks:
      - db
    volumes:
      - ./data/mongo:/data/db
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.13.3
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      default:
      caddy:
        aliases: [parley-webui]
    volumes:
      - ./data/open-webui:/app/backend/data
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      # Signup is closed; the first account (the administrator) can still be created while false.
      ENABLE_SIGNUP: "false"
      # Values from .env override settings saved in the database through the UI.
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      # Models: OpenAI-compatible endpoints of Anthropic, Gemini and OpenAI (URLs separated
      # by ";", keys in the same order). The Gemini URL has no trailing slash.
      OPENAI_API_BASE_URLS: "https://api.anthropic.com/v1;https://generativelanguage.googleapis.com/v1beta/openai;https://api.openai.com/v1"
      OPENAI_API_KEYS: "${ANTHROPIC_API_KEY:-};${GOOGLE_KEY:-};${OPENAI_API_KEY:-}"
      # Per-connection settings, keyed by the connection index above. model_ids limits each
      # provider to chat models: Gemini otherwise lists TTS and embedding models that fail
      # with tools. Connection 2 (OpenAI) uses the Responses API: on Chat Completions
      # gpt-6-luna accepts function tools only with reasoning_effort "none".
      OPENAI_API_CONFIGS: '{"0":{"model_ids":["claude-opus-5-5","claude-sonnet-5-5","claude-haiku-5-5"]},"1":{"model_ids":["gemini-3.8-flash","gemini-4-argon","gemini-4-carbon"]},"2":{"api_type":"responses","model_ids":["gpt-6-luna"]}}'
      # Speech-to-text: OpenAI.
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: https://api.openai.com/v1
      AUDIO_STT_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUDIO_STT_MODEL: gpt-transcribe
      # Tools: the tools MCP server (streamable HTTP), registered at startup.
      TOOL_SERVER_CONNECTIONS: '[{"type":"mcp","url":"http://tools:8000/mcp","path":"","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"parley-tools","name":"Parley tools","description":"Files and terminal in the notes and handoff clones"}}]'
    depends_on:
      tools:
        condition: service_healthy
    restart: unless-stopped

  tools:
    build: ./tools
    image: parley-tools:local
    # No ports are published: the service is reachable only inside the compose network.
    expose:
      - "8000"
    environment:
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-}
    volumes:
      - ${NOTES_DIR:?set NOTES_DIR in .env}:/data/notes
      - ${HANDOFF_DIR:?set HANDOFF_DIR in .env}:/data/handoff
      # Deploy keys, ssh config and known_hosts are prepared by the admin on the VPS.
      - ${TOOLS_SSH_DIR:?set TOOLS_SSH_DIR in .env}:/root/.ssh:ro
      # DesktopCommander config and logs (~/.claude-server-commander).
      - ./data/tools/desktop-commander:/root/.claude-server-commander
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  db:
    internal: true
  # The network where Caddy runs (selfhost-music compose project). Caddy is in a container
  # and cannot reach host ports on 127.0.0.1, so it proxies by name:
  # parley-librechat:3080 and parley-webui:8080. The 127.0.0.1 ports are for the ssh tunnel.
  caddy:
    external: true
    name: ${CADDY_NETWORK:-selfhost-music_default}
