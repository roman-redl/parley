# LibreChat v0.8.8 config. Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17

cache: true

# Single MCP container with tools: files and terminal in the notes and handoff clones.
mcpServers:
  tools:
    type: streamable-http
    url: http://tools:8000/mcp
    title: Tools
    description: Files and terminal (git) in the notes and handoff clones
    # The server sits on an internal network without OAuth: an explicit value disables auto-detection.
    requiresOAuth: false
    serverInstructions: true
    # Milliseconds per request to the server; headroom for git push and long commands.
    timeout: 120000

# LibreChat blocks requests to private addresses by default (SSRF protection).
# The tools container is an internal compose service, so its address is allowed explicitly.
mcpSettings:
  allowedAddresses:
    - "tools:8000"

# Speech-to-text: OpenAI. The key comes from .env.
speech:
  stt:
    openai:
      apiKey: "${OPENAI_API_KEY}"
      model: "gpt-transcribe"
  speechTab:
    speechToText:
      engineSTT: "external"
    textToSpeech: false

# Interface: extras removed to get a Poe-like look.
interface:
  presets: false
  bookmarks: false
  multiConvo: false
  runCode: false
  webSearch: false
  fileSearch: false
  # With modelSpecs present LibreChat hides the model selector unless this is set explicitly.
  # Keeps the free choice of any provider model next to the bots.
  modelSelect: true
  # LibreChat hides the parameters panel when modelSpecs exist; keep reasoning/thinking controls.
  parameters: true

# Bots. Each bot is a model spec: a model plus a short instruction that makes it read its role
# from the Obsidian vault at the start of every conversation (the vault is mounted into the
# tools container at /data/notes). Editing a role in Obsidian takes effect without a redeploy.
# The instruction text is a prompt for the model and stays in Russian: the vault is Russian.
# The model spec works on any endpoint: LibreChat turns it into an ephemeral agent with the
# MCP server listed in mcpServers.
# New bot: add an item here and run `docker compose up -d --force-recreate librechat`.
# enforce: false keeps the selection of models outside the specs available.
modelSpecs:
  enforce: false
  # false: a new chat keeps the last selection instead of opening the first bot (Opus) every time.
  prioritize: false
  list:
    - name: Erudite-assistant
      label: Erudite-assistant
      description: Personal analyst with the full context of the vault (Claude Opus)
      mcpServers:
        - tools
      preset:
        endpoint: anthropic
        model: claude-opus-5-5
        modelLabel: Erudite-assistant
        promptPrefix: |
          В начале разговора, до ответа: 1) в терминале выполни `git -C /data/notes pull --rebase`; 2) прочитай файл `/data/notes/Программное обеспечение/prompts/Parley — общие правила ботов.md` и файл своей роли `/data/notes/Программное обеспечение/prompts/Erudite-assistant.md`; 3) инструкции из блоков text этих файлов — твой системный промпт: работай в этой роли до конца разговора. При продолжении разговора, если файлы уже прочитаны, повторно не читать.

    - name: English-friend
      label: English-friend
      description: English tutor and text corrector (OpenAI gpt-6-luna)
      mcpServers:
        - tools
      preset:
        endpoint: openAI
        model: gpt-6-luna
        modelLabel: English-friend
        promptPrefix: |
          В начале разговора, до ответа: 1) в терминале выполни `git -C /data/notes pull --rebase`; 2) прочитай файл `/data/notes/Программное обеспечение/prompts/Parley — общие правила ботов.md` и файл своей роли `/data/notes/Программное обеспечение/prompts/English-friend.md`; 3) инструкции из блоков text этих файлов — твой системный промпт: работай в этой роли до конца разговора. При продолжении разговора, если файлы уже прочитаны, повторно не читать.

    - name: Brilliant-Sage
      label: Brilliant-Sage
      description: Truth, science and logic without moral censorship (Gemini Flash)
      mcpServers:
        - tools
      preset:
        endpoint: google
        model: gemini-3.8-flash
        modelLabel: Brilliant-Sage
        promptPrefix: |
          В начале разговора, до ответа: 1) в терминале выполни `git -C /data/notes pull --rebase`; 2) прочитай файл `/data/notes/Программное обеспечение/prompts/Parley — общие правила ботов.md` и файл своей роли `/data/notes/Программное обеспечение/prompts/Brilliant-Sage.md`; 3) инструкции из блоков text этих файлов — твой системный промпт: работай в этой роли до конца разговора. При продолжении разговора, если файлы уже прочитаны, повторно не читать.
