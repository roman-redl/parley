# LibreChat v0.8.8 config. Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.17

cache: true

# Format the server re-encodes uploaded images to (default png). With the larger resize limits
# of librechat/patch-images.sh a phone photo saved as PNG weighs 9-11 MB, above the 5 MB per
# image that LibreChat lets through to Anthropic; as WebP it is about 1 MB. Also applies to
# avatars and generated images.
imageOutputType: webp

# Single MCP container with tools: files and terminal in the notes and handoff clones.
mcpServers:
  tools:
    type: streamable-http
    url: http://tools:8000/mcp
    title: Tools
    description: Files and terminal (git) in the notes and handoff clones
    # The server sits on an internal network without OAuth: an explicit value disables auto-detection.
    requiresOAuth: false
    serverInstructions: true
    # Milliseconds per request to the server; headroom for git push and long commands.
    timeout: 120000

  # Headless browser (Playwright MCP) for reading web pages. The server is started with
  # --snapshot-mode none, so tool results stay small; the bot saves a page snapshot to a file
  # in /data/web (browser_snapshot with a filename) and searches the file in the tools terminal.
  # /data/web is the same directory in both containers.
  playwright:
    type: streamable-http
    url: http://playwright:8931/mcp
    title: Browser
    description: Headless browser (Playwright); page snapshots are saved to files in /data/web
    requiresOAuth: false
    # Milliseconds per request; page navigation inside the server times out at 60 seconds.
    timeout: 90000
    # One MCP session (one isolated browser context, one tab) per chat request instead of one
    # app-level connection shared by everybody: with a shared connection all chats would use the
    # same tab, and concurrent chats would overwrite each other's page. The header is not used by
    # the browser server; a {{LIBRECHAT_BODY_*}} placeholder in requestHeaders is what makes
    # LibreChat treat the connection as request-scoped (created for each chat request, closed
    # when the request ends; tool discovery omits requestHeaders). Consequence: the open page
    # lives only within one turn; the next turn starts with an empty browser, so the bot opens
    # the page again. Snapshot files in /data/web remain.
    requestHeaders:
      X-Parley-Conversation: "{{LIBRECHAT_BODY_CONVERSATIONID}}"

# LibreChat blocks requests to private addresses by default (SSRF protection).
# The tools and playwright containers are internal compose services, so their addresses are
# allowed explicitly.
mcpSettings:
  allowedAddresses:
    - "tools:8000"
    - "playwright:8931"

# Speech-to-text: OpenAI, with its own key from .env (a project without data sharing).
speech:
  stt:
    openai:
      apiKey: "${OPENAI_STT_API_KEY}"
      model: "gpt-transcribe"
  speechTab:
    speechToText:
      engineSTT: "external"
    textToSpeech: false

# Interface: extras removed to get a Poe-like look.
interface:
  presets: false
  bookmarks: false
  multiConvo: false
  runCode: false
  # Must be true: it grants the WEB_SEARCH permission to the roles, and without it LibreChat
  # silently strips the providers' native web search (web_search in the bot presets) as well.
  # The web search button in the chat starts LibreChat's own search, which is not configured
  # here and replaces the native tool: leave it off.
  webSearch: true
  fileSearch: false
  # With modelSpecs present LibreChat hides the model selector unless this is set explicitly.
  # Keeps the free choice of any provider model next to the bots.
  modelSelect: true
  # LibreChat hides the parameters panel when modelSpecs exist; keep reasoning/thinking controls.
  parameters: true

# Cap of a single tool result, in characters. A longer result is cut: head and tail are kept,
# the middle is replaced by a "[truncated: N chars exceeded <limit> limit]" notice. A single
# read_file of a web page (isUrl) once returned 400,000 characters (about 206k tokens) that
# was resent with every later request of the conversation, hence the default of 40,000 in
# `all`. The cap of an endpoint block wins over `all`.
# anthropic and google get 500,000 as a workaround: LibreChat counts the base64 of an image
# against this text cap. LibreChat-AI/agents PR #677 (open) gives images their own budget; after
# upgrading to a LibreChat whose @librechat/agents includes it, drop both blocks and keep the
# single 40,000 cap. Until then a new provider whose bots take screenshots needs its own block.
# A screenshot from the browser tool (browser_take_screenshot without a filename) travels as
# base64 and counts against this cap in characters, a 1280x800
# screenshot takes up to about 400,000 of them, and a larger one is dropped from the result
# ("[omitted 1 oversized atomic tool-content block: image_url]"). The model is billed for the
# picture by pixels (about 1,400 tokens for 1280x800), not by the characters. The higher cap
# also lets a large text result through, so the bot rules prevent those at the source: pages
# are read into files and searched there, never with read_file on a URL.
# openAI stays at 40,000 (no block, so `all` applies): the bots on it are the English tutors,
# which have no reason to search the web or read charts; a screenshot taken there is dropped.
# Caution: chat title generation reads endpoints.all instead of a per-endpoint block, so
# title settings added later under a specific endpoint would be ignored while `all` exists.
endpoints:
  all:
    maxToolResultChars: 40000
  anthropic:
    maxToolResultChars: 500000
  google:
    maxToolResultChars: 500000
  # Step limit of one reply (default 50). The main agent gets this many graph steps (a round of
  # tool calls costs 2, and from 3 rounds before the end it is told to converge). A subagent gets
  # floor(its limit / 3) model turns (3 graph steps = one turn) and loses its whole result when it
  # runs out, with no warning. The limit of a subagent is the `recursion_limit` of its saved agent
  # if set, else this value. The saved agents (agents/*.json) set 150, i.e. 50 turns, a margin over
  # the 33 tool calls their prompts allow; 75 here would give only 25 turns, which tests
  # showed to be too few. A full 50-turn run on Sonnet costs about $1.
  # The other agents settings keep their defaults (the block is parsed with schema defaults).
  agents:
    recursionLimit: 75

# Bots. Each bot is a model spec: a model plus a short instruction that makes it read its role
# from the Obsidian vault whenever its text is missing from the conversation: at the start and
# after LibreChat trims old tool results (the vault is mounted into the tools container at
# /data/notes). Editing a role in Obsidian takes effect without a redeploy.
# The instruction text is a prompt for the model and stays in Russian: the vault is Russian.
# The model spec works on any endpoint: LibreChat turns it into an ephemeral agent with the
# MCP server listed in mcpServers.
# New bot: add an item here and run `docker compose up -d --force-recreate librechat`.
# enforce: false keeps the selection of models outside the specs available.
modelSpecs:
  enforce: false
  # Providers listed here appear in the model menu next to the bots (requires
  # interface.modelSelect: true); without it only the bots are selectable.
  addedEndpoints:
    - anthropic
    - google
    - openAI
  # false: a new chat keeps the last selection instead of opening the first bot every time.
  prioritize: false
  list:
    # The basic bot, first in the menu: minimal personal context, short answers.
    - name: Quick
      label: Quick
      description: "General assistant for any question: minimal personal context, vault search"
      mcpServers:
        - tools
        - playwright
      # The subagent tool: the bot hands a task to one of two saved agents and gets back only
      # their final text, so search results and file contents stay out of the conversation. The
      # agents are created by agents/apply.js from agents/*.json and agents/*.md and run
      # without the conversation history. Each of the two exists in two variants with the same
      # tools and prompt: Anthropic bots get agent_researcher_anthropic and
      # agent_general_anthropic (Sonnet, effort medium, prompt cache 5 minutes, as on the bots),
      # Google bots get agent_researcher_google and agent_general_google (Gemini 4 Hydrogen,
      # thinking level medium, Google Search grounding). Researcher: search and reading, 11 tools, a small
      # start. General: any other work (edits, commands, data processing), almost all tools of
      # tools and playwright. Neither can start subagents (allowSelf: false, so a copy of the
      # bot is not offered). When to use which is set by the shared bot rules in the vault. Not
      # on the English bots: they do not search.
      subagents:
        enabled: true
        allowSelf: false
        agent_ids: [agent_researcher_anthropic, agent_general_anthropic]
      preset:
        endpoint: anthropic
        model: claude-opus-5-5
        # Prompt cache 5 minutes, see Erudite-assistant-Fable.
        promptCacheTtl: "5m"
        modelLabel: Quick
        effort: medium
        web_search: true
        maxContextTokens: 550000
        promptPrefix: |
          Если полного текста файлов `/data/notes/Программное обеспечение/prompts/Parley — общие правила ботов.md` и `/data/notes/Программное обеспечение/prompts/Quick.md` нет в разговоре — прочитай их перед ответом. Инструкции из блоков text этих файлов — твой системный промпт: работай в этой роли до конца разговора, не упоминай файлы промптов и роль.

    - name: Erudite-assistant-Fable
      label: Erudite-assistant-Fable
      description: Personal analyst with the full context of the vault
      mcpServers:
        - tools
        - playwright
      subagents:
        enabled: true
        allowSelf: false
        agent_ids: [agent_researcher_anthropic, agent_general_anthropic]
      preset:
        endpoint: anthropic
        # LibreChat 0.8.8 has no entry for claude-fable-5-2: the context window (1M) and the
        # prices come from the claude-fable-5 entry by prefix, so the recorded cost is higher
        # than the real one (10 / 50 / read 1 against 8 / 40 / 0.2 per million tokens).
        model: claude-fable-5-2
        # Prompt cache for 5 minutes instead of the default 1 hour: a 5-minute write costs 1.25
        # input price against 2, every tool call of a reply writes new results, and the first
        # message after a reply with many tool calls rewrites that reply anyway (LibreChat rebuilds
        # the history from the database without thinking signatures and tool images). Pauses of
        # 5-60 minutes, where 1 hour wins, are rare. The same on every Anthropic bot.
        promptCacheTtl: "5m"
        modelLabel: Erudite-assistant-Fable
        # Reasoning effort (sent as output_config.effort).
        effort: medium
        # Anthropic's native server-side web search tool. LibreChat's own webSearch is not
        # enabled (neither interface.webSearch nor spec-level webSearch): it would replace
        # the native tool.
        web_search: true
        # History cap, the same on every bot except the gpt-5.4-mini ones (their window is
        # 400k, LibreChat's default is kept). LibreChat keeps 5% in reserve; the system prompt
        # and tool descriptions are always sent. When the messages pass 80% of the rest, old
        # tool results are cut to about 4,000 characters; past the limit, older messages are
        # replaced by a summary written by the same model. It limits what LibreChat sends, not
        # the server-side web search loop of one request.
        maxContextTokens: 550000
        promptPrefix: |
          Если полного текста файлов `/data/notes/Программное обеспечение/prompts/Parley — общие правила ботов.md` и `/data/notes/Программное обеспечение/prompts/Erudite-assistant.md` нет в разговоре — прочитай их перед ответом. Инструкции из блоков text этих файлов — твой системный промпт: работай в этой роли до конца разговора, не упоминай файлы промптов и роль.

    # The same role file as Erudite-assistant-Fable, on Gemini 4 Carbon and Hydrogen. Notes:
    # LibreChat v0.8.8 has no price or context window data for these models (LibreChat issue
    # #17074), and the sources of the native search (Google Search grounding) are not shown in
    # the UI (issue #16665).

    - name: Erudite-assistant-Carbon
      label: Erudite-assistant-Carbon
      description: Personal analyst with the full context of the vault
      mcpServers:
        - tools
        - playwright
      subagents:
        enabled: true
        allowSelf: false
        agent_ids: [agent_researcher_google, agent_general_google]
      preset:
        endpoint: google
        model: gemini-4-carbon
        modelLabel: Erudite-assistant-Carbon
        thinking: true
        thinkingLevel: high
        # Required: without data for the model LibreChat falls back to the generic "gemini"
        # window (30,720) minus the 65,535 output tokens, i.e. a 1,024-token context.
        maxContextTokens: 550000
        # The model's output limit (32,768); LibreChat has no data for the model.
        maxOutputTokens: 32768
        # Google Search grounding. Do not enable LibreChat's own webSearch: it would remove the native tool.
        web_search: true
        promptPrefix: |
          Если полного текста файлов `/data/notes/Программное обеспечение/prompts/Parley — общие правила ботов.md` и `/data/notes/Программное обеспечение/prompts/Erudite-assistant.md` нет в разговоре — прочитай их перед ответом. Инструкции из блоков text этих файлов — твой системный промпт: работай в этой роли до конца разговора, не упоминай файлы промптов и роль.

